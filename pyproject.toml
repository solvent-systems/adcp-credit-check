[project]
name = "adcp-credit-check"
version = "0.1.0"
description = "A pre-trade credit check for AI agents buying ads over AdCP: a runnable simulation with three mock sellers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://solvent.systems"
Repository = "https://github.com/solvent-systems/adcp-credit-check"
Issues = "https://github.com/solvent-systems/adcp-credit-check/issues"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
adcp-credit-check = "adcp_credit_check.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adcp_credit_check"]
